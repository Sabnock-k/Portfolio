<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="3DSCrypt">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2018"/><stop offset="1" stop-color="#0a0f14"/></linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#143428"/><stop offset="1" stop-color="#0e2419"/></linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>

  <!-- faint hex data spilling out -->
  <g font-family="monospace" font-size="11" fill="#2fbf87" opacity="0.5">
    <text x="250" y="52">4E 43 53 44</text><text x="256" y="150">DE AD BE EF</text>
    <text x="40" y="48">00 01 FF</text><text x="36" y="158">C0 DE</text>
  </g>

  <!-- 3DS game cartridge -->
  <g transform="translate(200 100)">
    <!-- body: notched top-left corner like a 3DS card -->
    <path d="M-62 -48 h104 a8 8 0 0 1 8 8 v80 a8 8 0 0 1 -8 8 h-112 a8 8 0 0 1 -8 -8 v-70 z"
          fill="url(#cart)" stroke="#00e599" stroke-width="2.5"/>
    <!-- label area -->
    <rect x="-46" y="-34" width="92" height="40" rx="4" fill="#0a0f14" stroke="#00e599" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="-9" font-family="monospace" font-size="11" fill="#00e599" text-anchor="middle" letter-spacing="1">ROM</text>
    <!-- gold contact pins -->
    <g fill="#00e599">
      <rect x="-40" y="24" width="7" height="16" rx="1.5"/><rect x="-28" y="24" width="7" height="16" rx="1.5"/>
      <rect x="-16" y="24" width="7" height="16" rx="1.5"/><rect x="-4" y="24" width="7" height="16" rx="1.5"/>
      <rect x="8" y="24" width="7" height="16" rx="1.5"/><rect x="20" y="24" width="7" height="16" rx="1.5"/>
      <rect x="32" y="24" width="7" height="16" rx="1.5"/>
    </g>
    <!-- unlocked padlock = decrypted/hacked, clear of the label -->
    <g transform="translate(86 -34)">
      <rect x="-9" y="0" width="18" height="14" rx="2.5" fill="#00e599"/>
      <path d="M-5 0 v-5 a5 5 0 0 1 10 0" fill="none" stroke="#00e599" stroke-width="2.5"/>
    </g>
  </g>

  <text x="200" y="185" font-family="monospace" font-size="14" fill="#5de0ad" text-anchor="middle" letter-spacing="3">decrypt .3ds rom</text>
</svg>
